; CubeMeter firmware for HelloCubic-Lite (ESP8266 / ESP-12, 4MB flash, ST7789 240x240)
;
; First install:  upload .pio/build/hellocubic/firmware.bin at http://<cube-ip>/update (stock firmware)
; Later updates:  same /update page served by this firmware, or `pio run -t upload` (ArduinoOTA, see env below)

[env]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.flash_size = 4MB
; Same layout as the stock firmware 7.0.17 (app < 1MB, LittleFS 0x100000-0x3FA000).
; CubeMeter never mounts the filesystem, so OTA staging stays below 0x100000 and the
; stock LittleFS survives -> stock app can be restored via /update (docs/flashing.md).
board_build.ldscript = eagle.flash.4m3m.ld
; OTA needs current + new image to fit in 1MB; scripts/check_size.py enforces the budget.
extra_scripts = post:scripts/check_size.py
build_flags =
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	-DFW_VERSION=\"0.1.0\"
lib_deps =
	moononournation/GFX Library for Arduino@1.6.4
	bblanchon/ArduinoJson@7.4.2
	tzapu/WiFiManager@2.0.17

[env:hellocubic]

; Wireless re-flash once CubeMeter is running:  pio run -e hellocubic-ota -t upload
[env:hellocubic-ota]
upload_protocol = espota
upload_port = cube.local
